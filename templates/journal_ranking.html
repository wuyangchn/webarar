<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>地大最新期刊分类 (2023) - CUG Journal Ranking 2023</title>
    <link rel="icon" href="/static/image/logo32blue.svg">
    <!-- 兼容性设置 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <!-- 缩放设置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet" type="text/css">
    <link href="{% static 'bootstrap-3.3.7-dist/css/bootstrap.css' %}" rel="stylesheet"  type="text/css">
    <script src="{% static 'js/jquery-3.6.1.js' %}" type="text/javascript" charset="UTF-8"></script>
    <style>
        label{
            margin-right: 8px;
        }
        .xr-tier {
            border: 1px solid;
            padding: 0.2em 0.4em;
            border-radius: 0.5rem;
        }
        .xr-T1 {
            color: #c95d44;
            background-color: rgba(237,104,78,0.16);
            border-color: rgba(237,104,78,0.28);
        }
        .xr-T2 {
            color: #ad7b00 !important;
            background-color: rgba(254, 206, 1, 0.18) !important;
            border-color: rgba(254, 206, 1, 0.6) !important;
        }
        .xr-T3 {
            color: #4f9a2d !important;
            background-color: rgba(108, 196, 76, 0.16) !important;
            border-color: rgba(108, 196, 76, 0.28) !important;
        }
        .xr-T4 {
            color: #326da8 !important;
            background-color: rgba(51, 116, 188, 0.16) !important;
            border-color: rgba(51, 116, 188, 0.28) !important;
        }

        #zan-box {
            width: 70px;
            height: 70px;
            background: url(/static/image/OIP-C.png)no-repeat;
            background-position: right;
            background-size: cover;
            margin: 0;
            cursor: pointer;
        }
        #zan-box.animate {
            background-position: right;
            transition: background .6s steps(28);
        }
    </style>
    <script>
        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        function write_tbody(tiers, disciplines, search) {
            $("#tbody").empty();
            let num = 0
            const ignoreWords = ["AND", "OR", "THE", "A", "AN", "&", "OF", "ET", "DE"]
            data.forEach((journal, index) => {
                {#const search_words = eval("/^.*?"+search+".*?$/");#}
                const search_words = new RegExp(`.*${escapeRegExp(search)}.*`);
                const regex_parts_abbr = search.toUpperCase().split('').map(char =>
                    `\\b[^a-zA-Z]*${char}.*?(?:\\s+|AND\\s+|OR\\s+|OF\\s+|A\\s+|THE\\s+|AN\\s+|&\\s+|ET\\s+|DE\\s+)*`
                );
                const search_words_abbr = new RegExp(`^${regex_parts_abbr.join('')}.*$`, 'i');
                if (tiers.includes(journal.tier) && disciplines.includes(journal.subject) && (search_words.test(journal.full_name) || search_words_abbr.test(journal.full_name))) {
                    let tr = document.createElement('tr');
                    tr.style.backgroundColor = num%2===0? '#fffaf0':'#ffffff';
                    let th = document.createElement('th');
                    th.style.verticalAlign = 'bottom';
                    th.style.textAlign = 'center';
                    th.innerHTML = num + 1;
                    tr.appendChild(th);
                    for (let key in journal) {
                        if (!journal.hasOwnProperty(key)) { continue; }
                        const value = journal[key];
                        const td = document.createElement('td');
                        td.style.verticalAlign = 'bottom';
                        td.style.textAlign = 'center';
                        switch (key) {
                            case "full_name":
                                if (search_words.test(journal.full_name)) {
                                    td.innerHTML = search.length === 0 ? value : value.split(search).join(`<em style=\"background-color: yellow\">${search}</em>`);
                                }
                                if (search_words_abbr.test(journal.full_name)) {
                                    const full_name_list = journal.full_name.split(/\s+/);
                                    const search_list = search.toUpperCase().split('');
                                    let word_index = 0;
                                    let len = 0;
                                    const match_indexes = search_list.map(char => {
                                        for (let i = word_index; i < full_name_list.length; i++) {
                                            const word = full_name_list[i];
                                            len = len + word.length + 1;
                                            if (word.toUpperCase().startsWith(char) && !ignoreWords.includes(word.toUpperCase())) {
                                                word_index = i + 1;
                                                return len - word.length - 1;
                                            }
                                        }
                                    })
                                    if (match_indexes.includes(undefined)) { return; }
                                    const output_str = match_indexes.map((idx, i) => {
                                        return value.slice(i === 0 ? 0 : match_indexes[i-1]+1, idx) + `<em style=\"background-color: yellow\">${search_list[i]}</em>`;
                                    }).join("");
                                    td.innerHTML = search.length === 0 ? value : output_str + value.slice(match_indexes[match_indexes.length-1] + 1);
                                }
                                break;
                            case "letpub_id":
                                td.innerHTML = value === 0 ? `N/A` : `<button onclick="open_letpub(${value})">GoTo</button>`;
                                break;
                            case "tier":
                                var class_name = `xr-tier xr-${value}`
                                td.innerHTML = value === "N/A" ? `N/A` : `<span class="${class_name}" style="font-weight: bold">${value}</span>`;
                                {#td.innerHTML = `<span style=\"font-weight: bold\">${value}</span>`;#}
                                break;
                            case "xinrui_id":
                                td.innerHTML = value === "N/A" ? `N/A` : `<button onclick="open_xinrui('${value}')">GoTo</button>`;
                                break;
                            case "xinrui_tier":
                                var class_name = `xr-tier xr-${value}`
                                td.innerHTML = value === "N/A" ? `N/A` : `<span class="${class_name}">${value}</span>`;
                                break;
                            case "xinrui_top":
                                var top = value?'Top':'——';
                                td.innerHTML = top === "——" ? top : `<span style="color: #b46c1c; background-color: rgba(246,155,35,0.17); border-color: rgba(246,155,35,0.3); border: 1px solid; padding: 0.2em 0.4em; border-radius: 0.5rem">${top}</span>`;
                                break;
                            default:
                                td.innerHTML = value;
                                break;
                        }
                        tr.appendChild(td);
                    }
                    num = num + 1;
                    tbody.appendChild(tr);
                }
            });
        }
        function open_letpub(id) {
            window.open(`https://www.letpub.com.cn/index.php?journalid=${id}&page=journalapp&view=detail`, 'myWindow', 'width=1200,height=1000');
        }
        function open_xinrui(id) {
            window.open(`https://www.xr-scholar.com/Journals/${id}`, 'myWindow', 'width=1200,height=1000');
        }
        function clear_search() {
            $('#search').val('');
            refresh_table();
        }
        function search_journal() {
            if ($('#search').val().length !== 0) {
                refresh_table();
            }
        }
        function refresh_table() {
            var tiers = [];
            var disciplines = [];
            $("input[class='tier']:checked").each(function () {
                tiers.push($(this).val());
            })
            $("input.discipline:checked").each(function () {
                disciplines.push($(this).val());
            })
            if (disciplines.length !== 0 && $("#no_discipline").is(':checked')) {
                $("#no_discipline").prop("checked", false);
            }
            data.sort(function (a, b) {
                return parseInt(a['tier'][1])-parseInt(b['tier'][1])
            });
            search = $('#search').val().toUpperCase();
            write_tbody(tiers, disciplines, search);
        }
        function select_no_discipline() {
            var flag = false;
            if ($('#no_discipline').is(':checked')) {
                $("input.discipline:checked").each(function () {
                    $(this).prop('checked', false);
                    flag = true;
                });
                $("input[class='discipline_selector']:checked").prop('checked', false);
            }
            if (flag) {refresh_table();}
        }
        function select_all_disciplines() {
            var flag = false;
            if ($('#all_disciplines').is(':checked')) {
                $("input.discipline:not(:checked)").each(function () {
                    $(this).prop('checked', true);
                    flag = true;
                });
                $("input[class='discipline_selector']:not(:checked)").prop('checked', true);
                $('#no_discipline').prop('checked', false);
            }
            if (flag) {refresh_table();}
        }
        function select_geology() {
            var flag = false;
            if ($('#geology_disciplines').is(':checked')) {
                $("input.geology:not(:checked)").each(function () {
                    $(this).prop('checked', true);
                    flag = true;
                });
                $("input.not_geology:checked, input.social_sciences:checked").each(function () {
                    $(this).prop('checked', false);
                    flag = true;
                });
            }
            $('#no_discipline').prop('checked', false);
            $('#social_sciences_disciplines').prop('checked', false);
            $('#natural_sciences_disciplines').prop('checked', false);
            $('#all_disciplines').prop('checked', false);
            if (flag) {refresh_table();}
        }
        function select_natural_sciences() {
            var flag = false;
            if ($('#natural_sciences_disciplines').is(':checked')) {
                $("input.natural_sciences:not(:checked)").each(function () {
                    $(this).prop('checked', true);
                    flag = true;
                });
                $("input.social_sciences:checked").each(function () {
                    $(this).prop('checked', false);
                    flag = true;
                });
            }
            $('#no_discipline').prop('checked', false);
            $('#social_sciences_disciplines').prop('checked', false);
            $('#geology_disciplines').prop('checked', false);
            $('#all_disciplines').prop('checked', false);
            if (flag) {refresh_table();}
        }
        function select_social_sciences() {
            var flag = false;
            if ($('#social_sciences_disciplines').is(':checked')) {
                $("input.social_sciences:not(:checked)").each(function () {
                    $(this).prop('checked', true);
                    flag = true;
                });
                $("input.natural_sciences:checked").each(function () {
                    $(this).prop('checked', false);
                    flag = true;
                });
            }
            $('#no_discipline').prop('checked', false);
            $('#geology_disciplines').prop('checked', false);
            $('#natural_sciences_disciplines').prop('checked', false);
            $('#all_disciplines').prop('checked', false);
            if (flag) {refresh_table();}
        }
        function keyDownHandler(ev) {
            if (ev.keyCode === 13 && document.activeElement === document.getElementById('search')) {
                search_journal();
            }
        }
        function like_this_page() {
            zan_count += 1;
            $('#zan_counter').text(zan_count);
            $.ajax({
                url: "{% url 'journal_ranking_new_liker' %}",
                type: 'POST',
                data: '',
                contentType: 'application/json',
                success: function (res) {},
            });
        }

        $(document).ready(function () {
            refresh_table();
            window.addEventListener('keydown', keyDownHandler);
            $('#total_counter').text(total_count);
            $('#zan_counter').text(zan_count);
            const zanBox = document.getElementById('zan-box');
            zanBox.style.backgroundPosition = 'right';
            zanBox.addEventListener('click', function() {
                zanBox.style.transition = 'none';
                zanBox.style.backgroundPosition = 'left';
                void zanBox.offsetWidth;
                zanBox.style.transition = 'background-position 0.6s steps(28)';
                zanBox.style.backgroundPosition = 'right';
                $.ajax({
                    url: "{% url 'journal_ranking_new_liker' %}",
                    type: 'POST',
                    data: '',
                    contentType: 'application/json',
                    success: function (res) {
                        zan_count += 1;
                        $('#zan_counter').text(zan_count);
                    },
                });
            });
        });
    </script>
</head>
<body>
    <div style="display: flex; align-items: center;">
        <h1 style="margin: 0 0 0 80px;">地大最新期刊分类（2023）</h1>
        <div style="display: flex; align-items: center; margin-left: 30px"><div id="zan-box"></div></div>
        <span id="zan_counter" style="font-size: 16px; color: rgb(217,52,80); display: flex; align-items: center; margin-left: -20px"></span>
    </div>

    <div style="margin-left: 80px">
        <br>
            <div>
                <label>[查看<a target="_blank" href="https://eniec.cug.edu.cn/info/1048/1885.htm">学校公告</a>]</label>
                <label>[按级别+最新影响因子排序]</label>
                <label>[数据来自网络，反馈错误：<a href="mailto:ywu@webarar.net" target="_blank">ywu@webarar.net</a>]</label>
                <label>[<a target="_blank" href="https://jcr.clarivate.com/jcr/browse-journals">查询影响因子</a>]</label>
                <label>[查看<a href="http://kyy.neu.edu.cn/2024/0716/c10457a266027/page.psp" target="_blank">Nature Index</a>期刊目录]</label>
                <label>[目前仅接入部分<a href="https://www.xr-scholar.com/" target="_blank">新锐期刊分区表</a>数据]</label>
                <label>[数据库更新时间：2026-03-27，访问次数：<span id="total_counter"></span>]</label>
                <br>
                <label style="color: orangered"><input id="geology_disciplines" class="discipline_selector" type="checkbox" checked onchange="select_geology()">地学类</label>
                <label><input id="natural_sciences_disciplines" class="discipline_selector" type="checkbox" onchange="select_natural_sciences()">理工类</label>
                <label><input id="social_sciences_disciplines" class="discipline_selector" type="checkbox" onchange="select_social_sciences()">人文社科类</label>
                <label><input id="all_disciplines" class="discipline_selector" type="checkbox" onchange="select_all_disciplines()">全部学科</label>
                <label><input id="no_discipline" type="checkbox" onchange="select_no_discipline()">全部取消</label>
                <label><input id="search" type="search" style="width: 400px" placeholder="支持实词首字母缩写搜索，如EPSL"></label>
                <button onclick="search_journal()">搜索</button>
                <button style="margin-left: 2px" onclick="clear_search()">清空</button>
                <div id="discipline_div" style="margin-top: 5px; margin-bottom: 5px; margin-right: 80px">
                </div>
                <label><input type="checkbox" checked class="tier" value="T1" onchange="refresh_table()">T1</label>
                <label><input type="checkbox" checked class="tier" value="T2" onchange="refresh_table()">T2</label>
                <label><input type="checkbox" checked class="tier" value="T3" onchange="refresh_table()">T3</label>
                <label><input type="checkbox" checked class="tier" value="T4" onchange="refresh_table()">T4</label>
                <label><input type="checkbox" checked class="tier" value="T5" onchange="refresh_table()">T5</label>
                <label><input type="checkbox" checked class="tier" value="T6" onchange="refresh_table()">T6</label>
            </div>
        <br>
    </div>
    <table class="table table-bordered" style="width: 85%; margin-left: 80px">
        <thead>
            <tr>
                <th style="text-align: center">#</th>
                <th style="text-align: center">期刊名</th>
                <th style="width: 80px; text-align: center">地大分区</th>
                <th style="text-align: center">学科</th>
                <th style="width: 100px; text-align: center">大类</th>
                <th style="width: 90px; text-align: center">2021 JIF</th>
                <th style="width: 90px; text-align: center">2022 JIF</th>
                <th style="width: 90px; text-align: center">2023 JIF</th>
                <th style="width: 90px; text-align: center">2024 JIF</th>
                <th style="width: 90px; text-align: center">LetPub</th>
                <th style="width: 90px; text-align: center">新锐分区</th>
                <th style="width: 80px; text-align: center">新锐排名</th>
                <th style="width: 80px; text-align: center">新锐Top</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>

</body>
<script>
    let data = {{ data | safe }};
    let total_count = {{ total_count | safe }};
    let zan_count = {{ zan_count | safe }};
    let tbody = document.querySelector('tbody');
    let geology_disciplines = [
        '理工综合类', '地质学', '大气科学', '海洋科学', '地球物理学',
        '石油与天然气工程', '环境科学与工程', '测绘科学与技术', '地质资源与地质工程（资源）', '地质资源与地质工程（地球信息）',
        '地质资源与地质工程（勘察地球物理）', '地质资源与地质工程（岩土钻掘）', '地质资源与地质工程（工程地质）', '地理科学'
    ];
    let natural_sciences_disciplines = [
        '信息与通信工程', '物理学', '土木工程', '水利工程', '环境科学与工程',
        '机械工程', '安全科学与工程', '地质资源与地质工程（资源）', '地球物理学', '数学',
        '计算机科学与技术', '地理科学', '地质资源与地质工程（勘察地球物理）', '化学', '石油与天然气工程',
        '材料科学与工程', '地质资源与地质工程（工程地质）', '大气科学', '地质学', '软件工程',
        '海洋科学', '测绘科学与技术', '生物学', '地质资源与地质工程（岩土钻掘）', '地质资源与地质工程（地球信息）',
        '控制科学与工程', '应用经济学', '理工综合类'
    ];
    let social_sciences_disciplines = [
        '工商管理', '管理科学与工程', '外国语言文学', '新闻传播学', '法学',
        '马克思主义理论', '设计学', '教育学', '公共管理', '体育学',
        '心理学'
    ];
    let all_disciplines = [
        '理工综合类', '地质学', '大气科学', '海洋科学', '地球物理学',
        '石油与天然气工程', '环境科学与工程', '测绘科学与技术', '地质资源与地质工程（资源）', '地质资源与地质工程（地球信息）',
        '地质资源与地质工程（勘察地球物理）', '地质资源与地质工程（岩土钻掘）', '地质资源与地质工程（工程地质）', '地理科学',

        '信息与通信工程', '物理学', '土木工程', '水利工程', '机械工程',
        '安全科学与工程', '数学', '计算机科学与技术', '化学',
        '材料科学与工程', '软件工程', '生物学', '控制科学与工程', '应用经济学',

        '工商管理', '管理科学与工程', '外国语言文学', '新闻传播学', '法学',
        '马克思主义理论', '设计学', '教育学', '公共管理', '体育学',
        '心理学',
    ];

    all_disciplines.forEach((discipline, index) => {
        let color = geology_disciplines.includes(discipline) ? "orangered" : "black";
        let classified = geology_disciplines.includes(discipline) ? "geology natural_sciences discipline" : natural_sciences_disciplines.includes(discipline) ? "not_geology natural_sciences discipline" : "social_sciences discipline";
        let checked = geology_disciplines.includes(discipline) ? "checked" : "";
        $("#discipline_div").append(`<label style="color: ${color}"><input type="checkbox" class="${classified}" ${checked} value="${discipline}" name="${discipline}" onchange="refresh_table()">${discipline}</label>`);
    })

</script>
</html>
